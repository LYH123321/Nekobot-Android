name: Android CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify-website:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Verify website JavaScript syntax
        run: |
          node --check docs/i18n.js
          node --check docs/script.js

  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle
      # 之前把 test / lint / assemble 放在同一条 Gradle 命令里，lint 分析与 dex 合并共用
      # 一个 4G 堆的 daemon，导致 :app:packageDebug 在 ApkFlinger 里抛 OutOfMemoryError。
      # 这里改为：分阶段调用（每阶段独立 daemon，结束后释放内存）+ 调大堆 + 限制并发 worker。
      - name: Verify unit tests
        run: |
          ./gradlew --no-daemon --console=plain --stacktrace \
            --max-workers=2 \
            '-Dorg.gradle.jvmargs=-Xmx6g -Xss8m -Dfile.encoding=UTF-8' \
            -Pkotlin.incremental=false \
            testDebugUnitTest
      # Lint 检查已按需求移除（fork 自用版，只出包）
      - name: Verify debug build
        run: |
          ./gradlew --no-daemon --console=plain --stacktrace \
            --max-workers=2 \
            '-Dorg.gradle.jvmargs=-Xmx6g -Xss8m -Dfile.encoding=UTF-8' \
            -Pkotlin.incremental=false \
            assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: nekobot-apk
          path: app/build/outputs/apk/debug/*.apk
